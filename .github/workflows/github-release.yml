name: github-release

# GitHub Releases are separate from git tags. Pushing a tag updates the Tags
# page but does not create a Release; this workflow closes that gap. It also
# supports workflow_dispatch so an existing tag can be backfilled.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish as a GitHub Release (e.g. v0.1.43)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          range="${prev:+$prev..}$tag"
          git log --pretty=format:'- %h — %s' "$range" | grep -vE '^(.*release: v|.*Merge )' > /tmp/changes.md || true
          {
            echo "## Changes"
            if [ -s /tmp/changes.md ]; then cat /tmp/changes.md; else echo "- Version marker only."; fi
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev:-$tag}...$tag"
          } > /tmp/body.md
          gh release create "$tag" --verify-tag --title "$tag" --notes-file /tmp/body.md
          latest_tag="$(git tag --list 'v0.1.*' --sort=-version:refname | head -n 1)"
          if [ "$tag" != "$latest_tag" ]; then
            gh release edit "$tag" --latest=false
          fi
