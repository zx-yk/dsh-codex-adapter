# Manual release pipeline (fork-friendly).
#
# Why this is not `on: push: tags` anymore:
#   * a tag push used to start a full install/build/smoke cycle — minutes a
#     fork does not need to spend on every version marker;
#   * the publish step can only succeed for the upstream repository, because
#     npm trusted publishing (OIDC) is bound to ZSeven-W/dsh-crew. In a fork
#     the build ran, the publish failed, and nothing was gained.
#
# Run it from Actions -> release -> Run workflow when you actually want a
# verified tarball. Publishing stays available for the upstream repository
# (set `publish: true` there); everywhere else build locally with
# `pnpm run release:local`.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (upstream repository only, needs OIDC trust)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing; only the publish step uses it
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The bundled npm predates trusted publishing. Pinned to the major so a
      # future npm (which may e.g. reject setup-node's `always-auth` npmrc key
      # it currently only warns about) cannot break a release out of nowhere.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # Only meaningful when the run was started from a tag ref.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Rebuild the committed artifacts from the sources and prove the bundle
      # still starts: lib/client.js and lib/server.mjs are what the host
      # actually loads, and a stale one would ship unnoticed.
      - name: Build and smoke-test the bundle
        run: pnpm run build && pnpm run smoke:mcp

      # smoke:pack installs the packed tarball the way a user would and is the
      # only check that all four version fields agree.
      - name: Smoke-test the packed tarball
        run: pnpm run smoke:pack

      - name: Pack the tarball
        run: mkdir -p dist && npm pack --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-adapter-pack
          path: dist/*.tgz
          if-no-files-found: error

      # Publishing is skipped when the registry already has this version.
      # npm refuses to publish over an existing version, so without the guard
      # a re-run — or a version first published by hand — turns the release red
      # for a reason nobody needs to act on.
      - name: Publish
        if: inputs.publish && github.repository == 'ZSeven-W/dsh-crew'
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          npm publish --access public --tag latest

      - name: Skip publish (fork or publish=false)
        if: ${{ !inputs.publish || github.repository != 'ZSeven-W/dsh-crew' }}
        run: 'echo "Build verified only. Publish locally with: pnpm run release:local"'
